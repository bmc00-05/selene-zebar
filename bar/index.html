<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>selene-zebar</title>

    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/bar.css" />
    <link rel="stylesheet" href="./styles/brand.css" />
    <link rel="stylesheet" href="./styles/workspaces.css" />
    <link rel="stylesheet" href="./styles/active-window.css" />
    <link rel="stylesheet" href="./styles/memory.css" />
    <link rel="stylesheet" href="./styles/clock.css" />
    <link rel="stylesheet" href="./styles/calendar.css" />
    <link rel="stylesheet" href="./styles/battery.css" />
    <link rel="stylesheet" href="./styles/power.css" />
  </head>
  <body>
    <div class="bar">
      <div class="bar__region bar__region--left">
        <button
          class="brand"
          type="button"
          popovertarget="bar-menu"
          aria-label="selene-zebar menu"
        >
          <!--
            The mark, drawn rather than borrowed. A Nerd Font glyph used to sit
            here and rendered as an arrow: those codepoints move between font
            versions, and anyone without the font sees a box.

            The crescent is one disc with a second disc masked out of it. Moving
            `cx`/`cy` on the cutting circle changes the phase — pull it right for
            a thinner crescent, left for a fuller moon.
          -->
          <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
            <mask id="selene-crescent">
              <rect width="24" height="24" fill="black" />
              <circle cx="12" cy="12" r="9" fill="white" />
              <circle cx="17.5" cy="8.5" r="8.5" fill="black" />
            </mask>
            <rect
              width="24"
              height="24"
              fill="currentColor"
              mask="url(#selene-crescent)"
            />
          </svg>
        </button>

        <div class="workspaces" id="workspaces" hidden></div>
        <span class="offline" id="glazewm-offline">GlazeWM offline</span>
      </div>

      <div class="bar__region bar__region--center">
        <div class="active-window" id="active-window" hidden>
          <!--
            Both of these sit in one grid cell and cross-fade. The glyph is what
            the slot holds until the real icon arrives — extracting one costs
            most of a second the first time an application is focused, and an
            empty gap next to a title that has already changed reads as broken.
            It stays put for windows that turn out to have no icon at all.
          -->
          <span class="active-window__slot">
            <svg
              class="active-window__fallback"
              viewBox="0 0 16 16"
              aria-hidden="true"
            >
              <rect
                x="1.5"
                y="2.5"
                width="13"
                height="11"
                rx="2"
                fill="none"
                stroke="currentColor"
              />
              <line
                x1="1.5"
                y1="5.5"
                x2="14.5"
                y2="5.5"
                stroke="currentColor"
              />
            </svg>
            <span class="active-window__icon" aria-hidden="true"></span>
          </span>
          <span class="active-window__title"><span></span><span></span></span>
        </div>
      </div>

      <div class="bar__region bar__region--right">
        <!--
          Leftmost of the right-hand group on purpose. This region is anchored
          to the right edge, so a width change travels leftwards only: measured,
          the percentage going from 8% to 100% moves nothing at all here, where
          in any other slot it shifted the clock by 13px.

          `pathLength` normalises the circumference to 100, so the arc length in
          memory.css is a plain percentage rather than a fraction of 2*pi*r.
        -->
        <div class="memory" id="memory" hidden>
          <svg class="memory__ring" viewBox="0 0 16 16" aria-hidden="true">
            <circle
              class="memory__track"
              cx="8"
              cy="8"
              r="6"
              pathLength="100"
            />
            <circle class="memory__arc" cx="8" cy="8" r="6" pathLength="100" />
          </svg>
          <span class="memory__label"></span>
        </div>

        <!-- popovertarget is the whole connection between clock and calendar;
             neither component knows about the other in JavaScript. -->
        <button
          class="clock"
          id="clock"
          type="button"
          popovertarget="calendar"
          hidden
        >
          <span class="clock__label"></span>
        </button>

        <div class="battery" id="battery" hidden>
          <!--
            32x20 so it lands on whole device pixels at this display's 1.25
            scale. The battery itself is only 24x12 of that; the rest is margin
            the halo needs, because an SVG clips to its own box and a
            drop-shadow with nowhere to spread simply does not appear.

            The fill is drawn at full width and squeezed by a transform rather
            than resized — see battery.css.
          -->
          <svg class="battery__gauge" viewBox="0 0 32 20" aria-hidden="true">
            <!--
              The halo. A blurred copy of the shell outline, drawn underneath
              everything else and only when on mains.

              It is a separate shape rather than a filter on the <svg>, because
              a drop-shadow falls behind the filled parts too — the fill and the
              terminal each cast one inward, the glow pooled inside the case and
              the boundary between case and gauge went muddy. Blurring an
              outline leaves the interior alone.
            -->
            <rect
              class="battery__glow"
              x="4.5"
              y="5.5"
              width="20"
              height="9"
              rx="2.5"
            />
            <rect
              class="battery__fill"
              x="6"
              y="7"
              width="17"
              height="6"
              rx="1"
            />
            <rect
              class="battery__shell"
              x="4.5"
              y="5.5"
              width="20"
              height="9"
              rx="2.5"
            />
            <path class="battery__terminal" d="M26 8.5h1a1 1 0 0 1 0 3h-1z" />
          </svg>
          <span class="battery__label"></span>
        </div>

        <div class="power" id="power">
          <button
            class="power__button"
            type="button"
            popovertarget="power-overlay"
            aria-label="Power"
          >
            <!-- IEC 5009 power symbol: a broken ring with a stroke on top. -->
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none">
              <path
                d="M4.8 4.2a5 5 0 1 0 6.4 0"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <line
                x1="8"
                y1="2"
                x2="8"
                y2="7.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <!--
            The overlay is its own popover so the browser handles Escape and the
            top layer. It fills the window; power.js grows the window itself to
            cover the screen while this is open.
          -->
          <div class="power__overlay" id="power-overlay" popover>
            <div class="power__actions">
              <button class="power__action" type="button" data-action="lock">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <rect
                    x="4.5"
                    y="10.5"
                    width="15"
                    height="10"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />
                  <path
                    d="M8 10.5V7a4 4 0 0 1 8 0v3.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />
                </svg>
                <span class="power__label">Lock</span>
              </button>

              <button class="power__action" type="button" data-action="sleep">
                <!--
                  A gibbous moon, deliberately fuller and tilted the other way
                  from the thin crescent that is the bar's own mark, so the two
                  do not read as the same symbol. The label settles it.
                -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <mask id="power-sleep-moon">
                    <rect width="24" height="24" fill="black" />
                    <circle cx="12" cy="12" r="8.5" fill="white" />
                    <circle cx="5" cy="17" r="7" fill="black" />
                  </mask>
                  <rect
                    width="24"
                    height="24"
                    fill="currentColor"
                    mask="url(#power-sleep-moon)"
                  />
                </svg>
                <span class="power__label">Sleep</span>
              </button>

              <button
                class="power__action"
                type="button"
                data-action="restart"
                data-hold
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <path
                    d="M20 12a8 8 0 1 1-2.6-5.9"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <path
                    d="M20 3.5V9h-5.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="power__label">Restart</span>
                <span class="power__progress"></span>
              </button>

              <button
                class="power__action"
                type="button"
                data-action="shutdown"
                data-hold
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <path
                    d="M7.2 6.3a8 8 0 1 0 9.6 0"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <line
                    x1="12"
                    y1="3"
                    x2="12"
                    y2="11.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
                <span class="power__label">Shut down</span>
                <span class="power__progress"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--
      The widget window is only as tall as the bar, so a menu drawn below it
      would be clipped at the window edge. bar.js grows the window while this is
      open and shrinks it again on close; the reserved strip GlazeWM works
      around comes from the preset in zpack.json, not the live window size, so
      nothing on the desktop moves.
    -->
    <div class="menu" id="bar-menu" popover>
      <p class="menu__title">
        selene<span class="menu__title-dim">-zebar</span>
      </p>
      <button class="menu__item" type="button" data-action="reload-bar">
        Reload bar
      </button>
      <button class="menu__item" type="button" data-action="reload-glazewm">
        Reload GlazeWM config
      </button>
      <hr class="menu__rule" />
      <button class="menu__item" type="button" data-action="close-bar">
        Close bar
      </button>
    </div>

    <!--
      The calendar. Empty on purpose: the weekday headers depend on the locale
      and the days on today, so calendar.js writes both. It grows the window
      the same way the menu above does.
    -->
    <div class="calendar" id="calendar" popover>
      <p class="calendar__month"></p>
      <table class="calendar__grid">
        <thead>
          <tr class="calendar__head"></tr>
        </thead>
        <tbody class="calendar__body"></tbody>
      </table>
    </div>

    <script type="module" src="./bar.js"></script>
  </body>
</html>
