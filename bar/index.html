<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>selene-zebar</title>

    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/bar.css" />
    <link rel="stylesheet" href="./styles/panel.css" />
    <link rel="stylesheet" href="./styles/brand.css" />
    <link rel="stylesheet" href="./styles/menu.css" />
    <link rel="stylesheet" href="./styles/workspaces.css" />
    <link rel="stylesheet" href="./styles/media.css" />
    <link rel="stylesheet" href="./styles/active-window.css" />
    <link rel="stylesheet" href="./styles/volume.css" />
    <link rel="stylesheet" href="./styles/memory.css" />
    <link rel="stylesheet" href="./styles/clock.css" />
    <link rel="stylesheet" href="./styles/calendar.css" />
    <link rel="stylesheet" href="./styles/battery.css" />
    <link rel="stylesheet" href="./styles/power.css" />
  </head>
  <body>
    <div class="bar">
      <div class="bar__region bar__region--left">
        <button
          class="brand"
          type="button"
          popovertarget="bar-menu"
          aria-label="selene-zebar menu"
        >
          <!--
            The mark, drawn rather than taken from an icon font, so nothing has
            to be installed for it to show.

            A solid disc with a round bite out of it — an eclipse rather than a
            phase. A phase tapers to a point at both horns; this carve keeps the
            curve of the body that made it, which is the whole character of the
            mark.

            Filled, not outlined, and that matters more than it sounds: the mark
            sits beside a row of dots and a ring, all of them outlines and small
            circles. An outlined mark speaks their language and disappears into
            the row. A solid mass is the one thing in the region that is not a
            circle drawn in line.

            The bite has to break the rim — about two units here. Sealed inside,
            the silhouette stays a full circle and the mark reads as an eye;
            broken, the shape opens and it reads as a moon again.

            There is a ceiling on the radius too. Grow it much past this and the
            arc it cuts flattens out, the horns draw to points, and the mark
            turns into an ordinary crescent — which throws away the one thing
            that made it its own.

            The carve sits 4.1 units from the centre at 25 degrees above the
            horizontal. Those two numbers do separate jobs: the distance sets
            how deep the bite goes and so how heavy the crescent is left, the
            angle only turns it. Move the carve around a circle of that radius
            and the weight does not change at all. Flat on the horizontal the
            mark goes symmetric and stiff; much steeper and it starts to look
            like it is falling over.
          -->
          <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true">
            <mask id="selene-mark">
              <rect width="24" height="24" fill="black" />
              <circle cx="12" cy="12" r="9" fill="white" />
              <circle cx="15.72" cy="10.27" r="6.8" fill="black" />
            </mask>
            <rect
              width="24"
              height="24"
              fill="currentColor"
              mask="url(#selene-mark)"
            />
          </svg>
        </button>

        <div class="workspaces" id="workspaces" hidden></div>

        <!--
          The equaliser is the play indicator: it runs while playing and lies
          flat when nothing is, so no separate glyph is needed.

          The label scrolls only when it does not fit; media.js measures that
          and appends the second copy. Capped in CSS because this region
          overlaps the centre rather than pushing it.
        -->
        <button
          class="media"
          id="media"
          type="button"
          popovertarget="media-panel"
          hidden
        >
          <span class="media__eq" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="media__marquee">
            <span class="media__track"></span>
          </span>
        </button>

        <span class="offline" id="glazewm-offline">GlazeWM offline</span>
      </div>

      <div class="bar__region bar__region--center">
        <div class="active-window" id="active-window" hidden>
          <!--
            Both of these sit in one grid cell and cross-fade. The glyph is what
            the slot holds until the real icon arrives — extracting one costs
            most of a second the first time an application is focused, and an
            empty gap next to a title that has already changed reads as broken.
            It stays put for windows that turn out to have no icon at all.
          -->
          <span class="active-window__slot">
            <svg
              class="active-window__fallback"
              viewBox="0 0 16 16"
              aria-hidden="true"
            >
              <rect
                x="1.5"
                y="2.5"
                width="13"
                height="11"
                rx="2"
                fill="none"
                stroke="currentColor"
              />
              <line
                x1="1.5"
                y1="5.5"
                x2="14.5"
                y2="5.5"
                stroke="currentColor"
              />
            </svg>
            <span class="active-window__icon" aria-hidden="true"></span>
          </span>
          <span class="active-window__title"><span></span><span></span></span>
        </div>
      </div>

      <div class="bar__region bar__region--right">
        <!--
          Every part of the speaker is drawn here and the state lights the ones
          it wants; see volume.css. Muted and zero are different pictures on
          purpose — a muted device at 40% is silent, and the number alone
          cannot say that.

          A button, because clicking it mutes. The label stays `Mute` whatever
          the state and `aria-pressed` carries whether it is on, which is the
          ordinary shape of a toggle button; volume.js keeps it in step.
        -->
        <button
          class="volume"
          id="volume"
          type="button"
          aria-label="Mute"
          aria-pressed="false"
          hidden
        >
          <svg class="volume__icon" viewBox="0 0 16 16" aria-hidden="true">
            <path class="volume__cone" d="M2 6h2.6L8 3.1v9.8L4.6 10H2z" />
            <path
              class="volume__wave volume__wave--near"
              d="M10.3 6.3a2.4 2.4 0 0 1 0 3.4"
            />
            <path
              class="volume__wave volume__wave--far"
              d="M12.3 4.6a5 5 0 0 1 0 6.8"
            />
            <!--
              Wider than the arcs it replaces. The cross used to span 3.8 units
              where the lit arcs reach past 14, so the one state that has to be
              noticed was drawn smaller than the ones that do not.
            -->
            <path
              class="volume__cross"
              d="M10.2 5.8 14.8 10.2M14.8 5.8 10.2 10.2"
            />
          </svg>
          <span class="volume__label"></span>
        </button>

        <!--
          Near the front of the right-hand group on purpose. This region is
          anchored to the right edge, so a width change travels leftwards only,
          and from here the percentage going from 8% to 100% can push nothing
          but the volume beside it.

          `pathLength` normalises the circumference to 100, so the arc length in
          memory.css is a plain percentage rather than a fraction of 2*pi*r.
        -->
        <div class="memory" id="memory" hidden>
          <svg class="memory__ring" viewBox="0 0 16 16" aria-hidden="true">
            <circle
              class="memory__track"
              cx="8"
              cy="8"
              r="6"
              pathLength="100"
            />
            <circle class="memory__arc" cx="8" cy="8" r="6" pathLength="100" />
          </svg>
          <span class="memory__label"></span>
        </div>

        <!-- popovertarget is the whole connection between clock and calendar;
             neither component knows about the other in JavaScript. -->
        <button
          class="clock"
          id="clock"
          type="button"
          popovertarget="calendar"
          hidden
        >
          <span class="clock__label"></span>
        </button>

        <div class="battery" id="battery" hidden>
          <!--
            32x20 so it lands on whole device pixels at 1.25. The battery itself
            is only 24x12 of that; the rest is room for the halo, because an SVG
            clips to its own box. The fill is drawn at full width and squeezed
            by a transform rather than resized — see battery.css.
          -->
          <svg class="battery__gauge" viewBox="0 0 32 20" aria-hidden="true">
            <!--
              The halo: a blurred copy of the shell outline, drawn underneath
              everything else and lit only on mains. A separate shape rather
              than a filter on the <svg>, because a shadow on the whole gauge
              falls behind the fill too and pools inside the case.
            -->
            <rect
              class="battery__glow"
              x="4.5"
              y="5.5"
              width="20"
              height="9"
              rx="2.5"
            />
            <rect
              class="battery__fill"
              x="6"
              y="7"
              width="17"
              height="6"
              rx="1"
            />
            <rect
              class="battery__shell"
              x="4.5"
              y="5.5"
              width="20"
              height="9"
              rx="2.5"
            />
            <path class="battery__terminal" d="M26 8.5h1a1 1 0 0 1 0 3h-1z" />
          </svg>
          <span class="battery__label"></span>
        </div>

        <div class="power" id="power">
          <button
            class="power__button"
            type="button"
            popovertarget="power-overlay"
            aria-label="Power"
          >
            <!-- IEC 5009 power symbol: a broken ring with a stroke on top. -->
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none">
              <path
                d="M4.8 4.2a5 5 0 1 0 6.4 0"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <line
                x1="8"
                y1="2"
                x2="8"
                y2="7.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <!--
            The overlay is its own popover so the browser handles Escape and the
            top layer. It fills the window; lib/window.js grows the window to
            cover the screen while this is open.
          -->
          <div class="power__overlay" id="power-overlay" popover>
            <div class="power__actions">
              <button class="power__action" type="button" data-action="lock">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <rect
                    x="4.5"
                    y="10.5"
                    width="15"
                    height="10"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />
                  <path
                    d="M8 10.5V7a4 4 0 0 1 8 0v3.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />
                </svg>
                <span class="power__label">Lock</span>
              </button>

              <button class="power__action" type="button" data-action="sleep">
                <!--
                  A gibbous moon, deliberately fuller and tilted the other way
                  from the thin crescent that is the bar's own mark, so the two
                  do not read as the same symbol. The label settles it.
                -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <mask id="power-sleep-moon">
                    <rect width="24" height="24" fill="black" />
                    <circle cx="12" cy="12" r="8.5" fill="white" />
                    <circle cx="5" cy="17" r="7" fill="black" />
                  </mask>
                  <rect
                    width="24"
                    height="24"
                    fill="currentColor"
                    mask="url(#power-sleep-moon)"
                  />
                </svg>
                <span class="power__label">Sleep</span>
              </button>

              <button
                class="power__action"
                type="button"
                data-action="restart"
                data-hold
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <path
                    d="M20 12a8 8 0 1 1-2.6-5.9"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <path
                    d="M20 3.5V9h-5.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="power__label">Restart</span>
                <span class="power__progress"></span>
              </button>

              <button
                class="power__action"
                type="button"
                data-action="shutdown"
                data-hold
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                  <path
                    d="M7.2 6.3a8 8 0 1 0 9.6 0"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                  <line
                    x1="12"
                    y1="3"
                    x2="12"
                    y2="11.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
                <span class="power__label">Shut down</span>
                <span class="power__progress"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--
      The panels. Each is a popover anchored to its button, sharing one surface
      and motion through `.panel` (panel.css). The widget window is only as
      tall as the bar, so lib/window.js grows it while one of these is open.
    -->
    <div class="panel menu" id="bar-menu" popover>
      <!--
        The mark again, at the head of the panel it opens, so the panel reads
        as belonging to the button that was pressed. Identical geometry to the
        bar's; only the rendered size differs, and being solid it holds up small
        without a weight to tune.

        Its mask needs an id of its own — an SVG mask is looked up across the
        whole document, and the bar's mark already claims `selene-mark`.
      -->
      <p class="menu__title">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <mask id="menu-mark">
            <rect width="24" height="24" fill="black" />
            <circle cx="12" cy="12" r="9" fill="white" />
            <circle cx="15.72" cy="10.27" r="6.8" fill="black" />
          </mask>
          <rect
            width="24"
            height="24"
            fill="currentColor"
            mask="url(#menu-mark)"
          />
        </svg>
        <span>Selene</span>
      </p>

      <!--
        One chip per widget, in the order they sit on the bar, so the list can
        be read against what it controls. The key in `data-setting` is a key of
        DEFAULTS in lib/settings.js and the name in `data-widgets` that bar.css
        matches on — one name for the whole chain.

        Still role="switch": these are the same on/off controls the saver row
        is, drawn as a set to pick from rather than as eight rows. The count
        beside the heading is written by menu.js.

        The mark itself is not in the list: it is the way back to this panel.
      -->
      <p class="menu__section">
        Widgets <span class="menu__count" data-count="widget:"></span>
      </p>
      <div class="menu__chips">
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:workspaces"
        >
          Workspaces
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:media"
        >
          Media
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:active-window"
        >
          Window
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:volume"
        >
          Volume
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:memory"
        >
          RAM
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:clock"
        >
          Clock
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:battery"
        >
          Battery
        </button>
        <button
          class="menu__chip"
          type="button"
          role="switch"
          aria-checked="true"
          data-setting="widget:power"
        >
          Power
        </button>
      </div>

      <!--
        The equaliser normally runs on keyframes that have nothing to do with
        the music. This hands the same seven bars to cava, which captures the
        speakers and does the FFT that no provider here offers.

        `Not found` shows when cava.js has tried and failed — cava is not
        installed, or zpack.json does not allow it. It can only appear once an
        attempt has been made, and an attempt only happens while the equaliser
        is on screen, so switching this on with nothing playing says nothing
        either way. The switch is not turned back off: that is the user's, and
        the bar falls back to the keyframes on its own.
      -->
      <p class="menu__section">Media</p>
      <button
        class="menu__switch"
        type="button"
        role="switch"
        aria-checked="false"
        data-setting="cava"
      >
        <span>Live spectrum</span>
        <span class="menu__note">Cava not found</span>
        <span class="menu__track" aria-hidden="true">
          <span class="menu__thumb"></span>
        </span>
      </button>

      <p class="menu__section">Motion</p>
      <!--
        Saver mode stops the animations that never end — the breathing halos,
        the equaliser, the marquee. Everything else in the bar animates only in
        answer to something and then stops, which costs nothing at rest, so
        those are left alone. The rules are in each widget's own stylesheet,
        under :root[data-saver].
      -->
      <button
        class="menu__switch"
        type="button"
        role="switch"
        aria-checked="false"
        data-setting="saver"
      >
        <span>Saver mode</span>
        <span class="menu__track" aria-hidden="true">
          <span class="menu__thumb"></span>
        </span>
      </button>

      <!--
        Two ways to get back to a working bar, and nothing else. Reloading
        GlazeWM's config used to be here and is not any more: GlazeWM binds it
        to alt+shift+r itself, and this panel is about this bar rather than a
        console for the window manager. Closing the widget has gone the same
        way — the tray already exits Zebar, nothing restarts the bar
        automatically, and a button that takes it away does not belong next to
        eight that only change how it looks.
      -->
      <hr class="menu__rule" />
      <button class="menu__item" type="button" data-action="reload-bar">
        Reload bar
      </button>
      <button class="menu__item" type="button" data-action="reset">
        Reset settings
      </button>
    </div>

    <!--
      The calendar. Empty on purpose: the weekday headers depend on the locale
      and the days on today, so calendar.js writes both.
    -->
    <div class="panel calendar" id="calendar" popover>
      <p class="calendar__month"></p>
      <table class="calendar__grid">
        <thead>
          <tr class="calendar__head"></tr>
        </thead>
        <tbody class="calendar__body"></tbody>
      </table>
    </div>

    <!--
      The media panel. Title and artist are written by media.js, which also
      redraws the elapsed time twice a second while this is open — the provider
      reports a position only every few seconds.
    -->
    <div class="panel media-panel" id="media-panel" popover>
      <p class="media-panel__title"></p>
      <p class="media-panel__artist"></p>

      <div class="media-panel__rail">
        <div class="media-panel__progress"></div>
      </div>
      <div class="media-panel__times">
        <span class="media-panel__elapsed"></span>
        <span class="media-panel__total"></span>
      </div>

      <div class="media-panel__controls">
        <button
          class="media-panel__button"
          type="button"
          data-action="previous"
          aria-label="Previous"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 3.5v9L6 8z" fill="currentColor" />
            <rect x="3" y="3.5" width="1.6" height="9" fill="currentColor" />
          </svg>
        </button>

        <button
          class="media-panel__button"
          type="button"
          data-action="toggle"
          aria-label="Play"
        >
          <svg
            class="media-panel__icon--play"
            viewBox="0 0 16 16"
            aria-hidden="true"
          >
            <path d="M4.5 3l8 5-8 5z" fill="currentColor" />
          </svg>
          <svg
            class="media-panel__icon--pause"
            viewBox="0 0 16 16"
            aria-hidden="true"
          >
            <rect x="4" y="3" width="2.6" height="10" fill="currentColor" />
            <rect x="9.4" y="3" width="2.6" height="10" fill="currentColor" />
          </svg>
        </button>

        <button
          class="media-panel__button"
          type="button"
          data-action="next"
          aria-label="Next"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3 3.5v9L10 8z" fill="currentColor" />
            <rect x="11.4" y="3.5" width="1.6" height="9" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="./bar.js"></script>
  </body>
</html>
