# cava, as the bar needs it. Read by components/cava.js, which starts
# `cava -p <this file>` and reads the frames off its stdout.
#
# Only the keys that matter are here; everything else is cava's default. The
# full set with explanations is in cava's own example_files/config.

[general]

# Half the compositor's rate, and the single biggest lever on what this costs.
# Every frame is an FFT in cava, an IPC event into the webview and seven style
# writes, so the whole chain scales with this number. Measured against the
# keyframes it replaces, as process CPU on one core, under the same looped
# sound:
#
#     keyframes        10.4%
#     cava @ 30        18.4%    +8.0 points
#     cava @ 60        22.3%    +11.7 points
#
# Two thirds of the cost for movement that, at seven bars in a 16px box, is not
# obviously different. Raise it here if it ever looks stepped.
framerate = 30

# The seven the markup draws. Left to right is low to high, given mono below.
bars = 7

# Let cava find the level. A status bar is watched with whatever happens to be
# playing, so a fixed sensitivity is either flat on quiet tracks or pinned on
# loud ones.
autosens = 1

lower_cutoff_freq = 50
higher_cutoff_freq = 10000

# Seconds of silence before cava stops doing FFT and only checks for input once
# a second. It wakes on its own when sound returns. While asleep it stops
# emitting, so cava.js has a watchdog that walks the bars back down — otherwise
# they would freeze wherever the last frame left them.
sleep_timer = 3

[output]

# No [input] section on purpose: "On Windows this is automatic and no input
# settings are needed" — cava captures the default output device itself.

# Bar heights, written out for another program to read.
method = raw

# The literal string /dev/stdout is special-cased. On Windows it resolves to
# GetStdHandle(STD_OUTPUT_HANDLE), which is the pipe Zebar is holding; any
# other value makes cava create a named pipe under \\.\pipe\ instead, which
# nothing here would be reading.
raw_target = /dev/stdout

# Text, not binary. Zebar decodes stdout as UTF-8 and hands it over a line at a
# time, so binary would arrive mangled — and ascii's frame delimiter is the
# newline it splits on, which makes one event exactly one frame.
data_format = ascii

# A frame is `n;n;n;n;n;n;n;\n` — 59 is ';' and 10 is '\n'. Note the delimiter
# after the last bar as well as between them.
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

# Seven bars running low to high. `stereo` would mirror the two channels around
# the centre, which needs far more bars than this to read as anything.
channels = mono
mono_option = average

[smoothing]

# Lower than cava's default 77. The default is tuned for a terminal full of
# bars where the eye reads the envelope; at seven bars, 16px tall, that much
# smoothing flattens the movement into a slow swell.
noise_reduction = 45
